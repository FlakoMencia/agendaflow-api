spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendaflow_db}
    username: ${DB_USERNAME:agendaflow_user}
    password: ${DB_PASSWORD:agendaflow_local_password}
  jpa:
    properties:
      hibernate:
        default_schema: agendaflow
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: agendaflow,audit
    baseline-on-migrate: false
