spring:
  application:
    name: agendaflow-api
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  web:
    resources:
      add-mappings: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    lockout:
      maximum-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    user-token:
      secret: ${JWT_SECRET:local-only-change-me-user-token-secret-32-bytes-minimum}
      issuer: ${JWT_ISSUER:agendaflow-api}
      audience: ${JWT_AUDIENCE:agendaflow-web}
      time-to-live: ${JWT_ACCESS_TOKEN_TTL:30m}
    service-token:
      secret: ${SERVICE_JWT_SECRET:local-only-change-me-service-token-secret-32-bytes-minimum}
      issuer: ${SERVICE_JWT_ISSUER:agendaflow-api}
      audience: ${SERVICE_JWT_AUDIENCE:agendaflow-notification-service}
      time-to-live: ${SERVICE_JWT_TTL:5m}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.flakomencia.agendaflow: INFO
