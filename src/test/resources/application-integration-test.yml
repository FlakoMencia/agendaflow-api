spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: agendaflow
    schemas:
      - agendaflow
      - audit
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: agendaflow
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: never

logging:
  level:
    org.flywaydb: INFO
    org.testcontainers: INFO
    org.hibernate.tool.schema: INFO
